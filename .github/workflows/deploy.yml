name: Deploy Website to AWS S3

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test required website files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required website files exist."

      - name: Test HTML content
        run: |
          grep -q "DevOps Training" index.html
          echo "Website content test passed."

  build:
    name: Build / Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir -p dist
          cp index.html style.css script.js dist/
          echo "Deployment package created."
          ls -la dist

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist/

  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: website
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy website to S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET_NAME }} --delete
          echo "Website deployed successfully to S3."
